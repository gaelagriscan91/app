name: Build AAB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (vacío = número de ejecución)'
        required: false
        default: '67'

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # yarn + yarn.lock (npm install breaks ajv / ajv-keywords versions)
      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable || npm install -g yarn
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Build React
        working-directory: frontend
        env:
          CI: 'false'
          # Android app talks to the published backend
          REACT_APP_BACKEND_URL: https://harvest-track-94.emergent.host
        run: yarn build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Decode keystore and signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret ANDROID_${v#ANDROID_}"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > frontend/android/app/agriscan.jks
          printf "storeFile=agriscan.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > frontend/android/keystore.properties
          keytool -list -keystore frontend/android/app/agriscan.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::El keystore, la contraseña o el alias no coinciden"; exit 1; }
          echo "Keystore OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # gradle-wrapper.jar may be missing from the repo: regenerate it
      - name: Ensure Gradle wrapper
        working-directory: frontend/android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type all
          fi
          chmod +x gradlew

      - name: Build AAB
        working-directory: frontend/android
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: |
          echo "versionCode = $VERSION_CODE"
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        working-directory: frontend/android
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$AAB" | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt || { echo "::error::El AAB no quedó firmado"; exit 1; }

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
