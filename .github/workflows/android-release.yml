name: Build AAB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # yarn + yarn.lock (npm install breaks ajv / ajv-keywords versions)
      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable || npm install -g yarn
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Build React
        working-directory: frontend
        env:
          CI: 'false'
          # Android app talks to the published backend
          REACT_APP_BACKEND_URL: https://harvest-track-94.emergent.host
        run: yarn build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Signing config (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/app/agriscan.jks
            printf "storeFile=agriscan.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > frontend/android/keystore.properties
            echo "Signing enabled"
          else
            echo "No keystore secrets: AAB will be unsigned"
          fi

      - name: Build AAB
        working-directory: frontend/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
